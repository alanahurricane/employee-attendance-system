
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Bem-Vindo!</title>

    <style>
        
        .logo {
            display: block;
            width: 300%;
            max-width: 200px;
            min-width: 60px;
            margin: 0 auto 5%;
            height: auto;
        }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        button {
            padding: 12px 20px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }

        #entrada {
            background-color: #198754;
        }

        #saida {
            background-color: #dc3545;
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        #mensagem {
            margin-top: 20px;
            font-weight: bold;
        }
        
        #historico {
            background-color: #7e797a;
        }

    </style>
</head>

<body>

<img src="../static/Logo.png"
     alt="Logo"
     class="logo">


    <h1>Bem-vindo!</h1>

    <p>Horário de Brasília: <span id="hora"></span></p>

    <button
        type="button"
        id="entrada"
        onclick="baterEntrada()">
        Registrar Entrada
    </button>

    <button
        type="button"
        id="saida"
        onclick="baterSaida()"
        disabled>
        Registrar Saída
    </button>

    <p id="mensagem"></p>

    <script>
        function obterHoraBrasilia() {
            return new Date().toLocaleTimeString("pt-BR", {
                timeZone: "America/Sao_Paulo",
                hour12: false
            });
        }

        function atualizarHora() {
            document.getElementById("hora").textContent =
                obterHoraBrasilia();
        }

        function baterEntrada() {
            const hora = obterHoraBrasilia();

            document.getElementById("mensagem").textContent =
                "Entrada registada às " + hora + "!";

            document.getElementById("entrada").disabled = true;
            document.getElementById("saida").disabled = false;
        }

        function baterSaida() {
            const hora = obterHoraBrasilia();

            document.getElementById("mensagem").textContent =
                "Saída registada às " + hora + "!";

            document.getElementById("saida").disabled = true;
            document.getElementById("entrada").disabled = false;
        }

        atualizarHora();
        setInterval(atualizarHora, 1000);
    </script>

    <button
        type="button"
        id="historico"
        onclick="window.location.href='/registros_do_usuario'">
        Meu histórico
    </button>

</body>
</html>
