
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ponto Eletrônico - ETEC</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: white;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5%;
        }

        .container-login {
            width: 100%;
            max-width: 400px;
        }

        .logo {
            display: block;
            width: 50%;
            max-width: 200px;
            min-width: 60px;
            height: auto;
            margin: 0 auto 5%;
        }

        .caixa-login {
            background-color: #e6e6e6;
            width: 100%;
            padding: 8%;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #272121;
            margin-top: 0;
            margin-bottom: 10%;
        }

        label {
            display: block;
            margin-bottom: 2%;
            color: #333333;
        }

        input {
            width: 100%;
            padding: 3%;
            margin-bottom: 6%;
            border: 1px solid #cccccc;
            border-radius: 5px;
            font-size: 1rem;
        }

        .esqueceu-senha {
            display: block;
            text-align: right;
            color: #8e0e0e;
            text-decoration: none;
            margin-bottom: 8%;
        }

        .esqueceu-senha:hover {
            text-decoration: underline;
        }

        button {
            width: 100%;
            padding: 4%;
            background-color: #8e0e0e;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
        }

        button:hover {
            background-color: #6d0b0b;
        }

        @media (max-width: 600px) {
            .container-login {
                max-width: 100%;
            }

            .logo {
                width: 40%;
            }
        }
    </style>
</head>

<body>

    <div class="container-login">

        <img
            src="../static/Logo.png"
            alt="Logo da ETEC"
            class="logo"
        >

        <main class="caixa-login">

            <h1>Login</h1>

            <form method="POST" action="/login">

                <label for="usuario">E-mail:</label>
                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    autocomplete="username"
                    required
                >

                <label for="senha">Senha:</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    autocomplete="current-password"
                    required
                >

                <a href="/esqueceu-senha" class="esqueceu-senha">
                    Esqueceu a senha?
                </a>

                <button type="submit">Entrar</button>

            </form>

        </main>

    </div>

</body>
</html>
