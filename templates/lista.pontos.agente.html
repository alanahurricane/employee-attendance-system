<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de pontos agentes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: white;
            margin: 0;
            min-height: 100vh;
            padding: 3%;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            display: block;
            width: 220px;
            max-width: 70%;
            height: auto;
            margin: 0 auto 30px;
        }

        h1 {
            text-align: center;
            color: #272121;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .subtitulo {
            text-align: center;
            color: #333333;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .caixa-tabela {
            background-color: #e6e6e6;
            width: 100%;
            padding: 25px;
            border-radius: 10px;
        }

        .area-tabela {
            width: 100%;
            overflow-x: auto;
            border-radius: 5px;
        }

        table {
            width: 100%;
            min-width: 1100px;
            border-collapse: collapse;
            background-color: white;
        }

        thead {
            background-color: #8e0e0e;
            color: white;
        }

        th, td {
            padding: 15px 12px;
            text-align: left;
            border-bottom: 1px solid #cccccc;
            font-size: 0.9rem;
        }

        th {
            font-weight: bold;
            white-space: nowrap;
        }

        tbody tr:nth-child(even) {
            background-color: #f5f5f5;
        }

        tbody tr:hover {
            background-color: #eeeeee;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: bold;
            white-space: nowrap;
        }

        .pendente {
            background-color: #fff0cc;
            color: #805b00;
        }

        .analisado {
            background-color: #d9ead3;
            color: #274e13;
        }

        .botoes-apontamento {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-presente {
            background-color: #38761d;
        }

        .btn-presente:hover {
            background-color: #274e13;
        }

        .btn-atraso {
            background-color: #bf9000;
        }

        .btn-atraso:hover {
            background-color: #7f6000;
        }

        .btn-falta {
            background-color: #8e0e0e;
        }

        .btn-falta:hover {
            background-color: #6d0b0b;
        }

        .decisao {
            font-weight: bold;
            font-size: 0.85rem;
            color: #38761d;
            white-space: nowrap;
        }

        .rodape {
            margin-top: 20px;
            color: #333333;
            font-size: 0.85rem;
            text-align: right;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.conteudo-visivel {
            display: flex;
        }

        .modal-conteudo {
            background-color: white;
            width: 100%;
            max-width: 400px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .modal-conteudo h2 {
            color: #272121;
            margin-top: 0;
            font-size: 1.3rem;
        }

        .modal-conteudo p {
            color: #333333;
            line-height: 1.5;
        }

        .modal-botoes {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        .btn-cancelar {
            background-color: #cccccc;
            color: #272121;
        }

        .btn-confirmar {
            background-color: #8e0e0e;
            color: white;
        }

        button:focus-visible {
            outline: 2px solid #272121;
            outline-offset: 3px;
        }

        @media (max-width: 600px) {
            body {
                padding: 5%;
            }

            .logo {
                width: 180px;
            }

            h1 {
                font-size: 1.4rem;
            }

            .caixa-tabela {
                padding: 12px;
            }

            th, td {
                padding: 12px 10px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <img
            src="../static/Logo.png"
            alt="Logo da ETEC"
            class="logo"
        >

        <header>
            <h1>Análise de Pontos Eletrônicos</h1>

            <p class="subtitulo">
                Acompanhamento dos registros de ponto dos professores
            </p>
        </header>

        <main class="caixa-tabela">

            <div class="area-tabela">
                <table>
                    <thead>
                        <tr>
                            <th>Nome do professor</th>
                            <th>Coordenação</th>
                            <th>Status da análise</th>
                            <th>Data e horário de criação</th>
                            <th>Tipo de ponto</th>
                            <th>Apontamento</th>
                        </tr>
                    </thead>

                    <tbody id="tabelaPontos">
                        <tr>
                            <td colspan="6">Carregando pontos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <p class="rodape">
                Exibindo <span id="totalPontos">0</span> registros
            </p>

        </main>
    </div>

    <!-- Modal de confirmação -->
    <div
        class="modal"
        id="modalConfirmacao"
        role="dialog"
        aria-modal="true"
        aria-labelledby="tituloModal"
        aria-describedby="mensagemConfirmacao">

        <div class="modal-conteudo">

            <h2 id="tituloModal">Confirmar apontamento</h2>

            <p id="mensagemConfirmacao"></p>

            <div class="modal-botoes">

                <button
                    type="button"
                    class="btn btn-cancelar"
                    onclick="fecharModal()">
                    Cancelar
                </button>

                <button
                    type="button"
                    class="btn btn-confirmar"
                    onclick="confirmarApontamento()">
                    Confirmar
                </button>

            </div>
        </div>
    </div>

    <script>
        let pontos = [];

        let registroSelecionado = null;
        let apontamentoSelecionado = null;

        // Cria uma célula da tabela
        function criarCelula(valor) {
            const celula = document.createElement('td');
            celula.textContent = valor ?? '-';

            return celula;
        }

        // Renderiza os pontos recebidos do servidor
        function renderizarTabela() {
            const tabela = document.getElementById('tabelaPontos');

            tabela.replaceChildren();

            if (pontos.length === 0) {
                const linha = document.createElement('tr');
                const celula = document.createElement('td');

                celula.colSpan = 6;
                celula.className = 'vazio';
                celula.textContent = 'Nenhum ponto cadastrado.';

                linha.appendChild(celula);
                tabela.appendChild(linha);

            } else {

                pontos.forEach(ponto => {

                    const linha = document.createElement('tr');

                    // Nome do professor
                    linha.appendChild(
                        criarCelula(ponto.criador)
                    );

                    // Coordenação: não existe no banco atualmente
                    linha.appendChild(
                        criarCelula('-')
                    );

                    // Status da análise
                    const celulaStatus = document.createElement('td');
                    const status = document.createElement('span');

                    status.id = `status-${ponto.id}`;
                    status.className = 'status pendente';
                    status.textContent = ponto.status || 'Pendente';

                    if (
                        ponto.status &&
                        ponto.status.toLowerCase().includes('analisado')
                    ) {
                        status.className = 'status analisado';
                    }

                    celulaStatus.appendChild(status);
                    linha.appendChild(celulaStatus);

                    // Data e horário de criação
                    linha.appendChild(
                        criarCelula(ponto.data_criacao)
                    );

                    // Tipo de ponto
                    linha.appendChild(
                        criarCelula(ponto.tipo_ponto)
                    );

                    // Apontamento
                    const celulaApontamento =
                        document.createElement('td');

                    celulaApontamento.id =
                        `apontamento-${ponto.id}`;

                    // Cria os três botões
                    const botoes = document.createElement('div');
                    botoes.className = 'botoes-apontamento';

                    const opcoes = [
                        {
                            texto: 'Presente',
                            classe: 'btn-presente'
                        },
                        {
                            texto: 'Atraso',
                            classe: 'btn-atraso'
                        },
                        {
                            texto: 'Falta',
                            classe: 'btn-falta'
                        }
                    ];

                    opcoes.forEach(opcao => {

                        const botao = document.createElement('button');

                        botao.type = 'button';
                        botao.className = `btn ${opcao.classe}`;
                        botao.textContent = opcao.texto;

                        botao.addEventListener('click', () => {
                            solicitarConfirmacao(
                                ponto.id,
                                opcao.texto,
                                ponto.criador
                            );
                        });

                        botoes.appendChild(botao);
                    });

                    celulaApontamento.appendChild(botoes);
                    linha.appendChild(celulaApontamento);

                    tabela.appendChild(linha);
                });
            }

            document.getElementById('totalPontos').textContent =
                pontos.length;
        }

        // Consulta os pontos no servidor
        async function carregarPontos() {
            const tabela = document.getElementById('tabelaPontos');

            try {
                const resposta = await fetch('/consultar-pontos');

                if (!resposta.ok) {
                    throw new Error('Erro ao consultar pontos.');
                }

                const dados = await resposta.json();

                if (!Array.isArray(dados)) {
                    throw new Error('Resposta inválida do servidor.');
                }

                pontos = dados;

                renderizarTabela();

            } catch (erro) {
                console.error('Erro ao carregar pontos:', erro);

                tabela.replaceChildren();

                const linha = document.createElement('tr');
                const celula = document.createElement('td');

                celula.colSpan = 6;
                celula.textContent =
                    'Não foi possível carregar os pontos.';

                linha.appendChild(celula);
                tabela.appendChild(linha);
            }
        }

        // Abre o modal
        function solicitarConfirmacao(id, apontamento, professor) {

            registroSelecionado = id;
            apontamentoSelecionado = apontamento;

            document.getElementById('mensagemConfirmacao').textContent =
                `Deseja realmente registrar "${apontamento}" para ${professor}?`;

            document.getElementById('modalConfirmacao')
                .classList.add('conteudo-visivel');
        }

        // Fecha o modal
        function fecharModal() {

            document.getElementById('modalConfirmacao')
                .classList.remove('conteudo-visivel');

            registroSelecionado = null;
            apontamentoSelecionado = null;
        }

        // Confirma visualmente o apontamento
        function confirmarApontamento() {

            if (
                registroSelecionado === null ||
                apontamentoSelecionado === null
            ) {
                return;
            }

            const id = registroSelecionado;

            const status = document.getElementById(`status-${id}`);

            status.textContent = 'Analisado pelo agente';
            status.className = 'status analisado';

            const celulaApontamento =
                document.getElementById(`apontamento-${id}`);

            celulaApontamento.replaceChildren();

            const resultado = document.createElement('span');

            resultado.className = 'decisao';
            resultado.textContent = apontamentoSelecionado;

            celulaApontamento.appendChild(resultado);

            fecharModal();
        }

        // Fecha ao clicar fora do modal
        document.getElementById('modalConfirmacao')
            .addEventListener('click', function(event) {

                if (event.target === this) {
                    fecharModal();
                }
            });

        // Fecha ao pressionar ESC
        document.addEventListener('keydown', function(event) {

            if (event.key === 'Escape') {
                fecharModal();
            }
        });

        // Carrega os pontos ao abrir a página
        document.addEventListener(
            'DOMContentLoaded',
            carregarPontos
        );
    </script>

</body>
</html>
