
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu histórico</title>

    <style>
        
        .logo {
            display: block;
            width: 300%;
            max-width: 200px;
            min-width: 60px;
            margin: 0 auto 5%;
            height: auto;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #272121;
        }

        table {
            width: 100%;
            max-width: 900px;
            margin: 30px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            padding: 15px;
            border: 1px solid #dddddd;
            text-align: center;
        }

        th {
            background-color: #8e0e0e;
            color: white;
        }

        .status {
            color: #856404;
            background-color: #fff3cd;
            font-weight: bold;
        }

        .voltar {
            display: block;
            width: fit-content;
            margin: 25px auto;
            padding: 12px 20px;
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .voltar:hover {
            background-color: #545b62;
        }



    </style>
</head>

<body>

<img src="../static/Logo.png"
     alt="Logo"
     class="logo">

    <h1>Meu histórico</h1>

    <table>
        <thead>
            <tr>
                <th>Data</th>
                <th>Hora</th>
                <th>Tipo</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>19/10/2026</td>
                <td>08:00:00</td>
                <td>Entrada</td>
                <td class="status">Em análise</td>
            </tr>

            <tr>
                <td>19/10/2026</td>
                <td>12:00:00</td>
                <td>Saída</td>
                <td class="status">Em análise</td>
            </tr>
        </tbody>
    </table>

    <a href="/" class="voltar">Voltar ao ponto eletrônico</a>

</body>
</html>
